version: '3.8'

services:
  db:
    image: postgres:18
    container_name: bookshelf-db
    environment:
      POSTGRES_USER: bookshelf
      POSTGRES_PASSWORD: bookshelf
      POSTGRES_DB: bookshelf
    ports:
      - "5432:5432"
    volumes:
      - bookshelf_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bookshelf-api
    environment:
      # Переопределяем DATABASE_URL: внутри Docker сеть имя сервиса = хост
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      RESERVATION_HOURS: ${RESERVATION_HOURS}
      LOAN_DAYS: ${LOAN_DAYS}
      MAX_ACTIVE_RESERVATIONS: ${MAX_ACTIVE_RESERVATIONS}
      FINE_PER_DAY: ${FINE_PER_DAY}
      FINE_LOST: ${FINE_LOST}
      SUBSCRIPTION_PRICE: ${SUBSCRIPTION_PRICE}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  nginx:
    build:
      context: ./docker/nginx
    container_name: bookshelf-nginx
    ports:
      - "80:80"     # перенаправляет на HTTPS
      - "443:443"   # HTTPS
    depends_on:
      - api

volumes:
  bookshelf_pgdata:
    external: true