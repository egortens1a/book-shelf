upstream api_backend {
    server api:8000;
}

# HTTP (порт 80): только перенаправление на HTTPS.
# 308, а не 301: при 301 клиенты превращают POST в GET, и /login сломался бы.
server {
    listen 80;
    server_name bookshelf.localhost;

    return 308 https://$host$request_uri;
}

# HTTPS (порт 443): здесь шифрование заканчивается, дальше запрос идёт к API по HTTP
# внутри закрытой сети Docker.
server {
    listen 443 ssl;
    server_name bookshelf.localhost;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Статика
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API
    location / {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}