$kind: collection
description: |-
  Подписки, экземпляры, бронирование, штрафы, чтение, список желаний и статистика.

  Перед запуском: поднять базу и накатить тестовые данные (python -m app.scripts.seed), затем запустить API (python -m app.main).

  Папки идут в порядке сценария: сначала вход всеми тремя ролями, дальше подписка, экземпляр, бронь, выдача, возврат. Идентификаторы созданных объектов тесты сохраняют в переменные коллекции сами.

  Окружение: выберите «Bookshelf local». Все переменные (учётные записи, токены, id созданных объектов) хранятся только в нём, в самих коллекциях переменных нет. Данные: python -m app.scripts.seed.
