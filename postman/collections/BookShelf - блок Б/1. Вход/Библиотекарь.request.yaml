$kind: http-request
url: '{{baseUrl}}/login'
method: POST
body:
  type: urlencoded
  content:
    username: '{{librarianEmail}}'
    password: '{{librarianPassword}}'
auth:
  type: noauth
scripts:
- type: afterResponse
  code: |-
    pm.test('200', () => pm.response.to.have.status(200));
    pm.environment.set('librarianToken', pm.response.json().access_token);
  language: text/javascript
order: 2000
