$kind: http-request
description: PUT, потому что операция идемпотентна. Позиция за пределами текста даёт 422. Дойдя до конца, книга помечается прочитанной — и её можно оценить.
url: '{{baseUrl}}/books/{{readBookId}}/progress'
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "position": 10
    }
auth:
  type: bearer
  credentials:
    token: '{{subscriberToken}}'
order: 3000
