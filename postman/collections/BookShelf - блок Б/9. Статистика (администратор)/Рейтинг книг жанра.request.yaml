$kind: http-request
description: Только опубликованные книги с оценками. limit ограничен 1..50, иначе 422.
url: '{{baseUrl}}/admin/stats/top?genre_id={{statsGenreId}}&limit=10'
method: GET
queryParams:
  genre_id: '{{statsGenreId}}'
  limit: '10'
auth:
  type: bearer
  credentials:
    token: '{{adminToken}}'
order: 2000
