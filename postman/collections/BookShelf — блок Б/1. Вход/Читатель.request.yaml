$kind: http-request
description: "OAuth2 password flow: форма, а не JSON. Токен сохраняется в readerToken."
url: "{{baseUrl}}/login"
method: POST
body:
  type: urlencoded
  content:
    username: "{{readerEmail}}"
    password: "{{password}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('200', () => pm.response.to.have.status(200));
      const t = pm.response.json().access_token;
      pm.collectionVariables.set('readerToken', t);
    language: text/javascript
order: 1000
