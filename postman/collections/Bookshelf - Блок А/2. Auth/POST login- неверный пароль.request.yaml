$kind: http-request
name: 'POST login: неверный пароль'
url: '{{baseUrl}}/login'
method: POST
body:
  type: urlencoded
  content:
    username: '{{readerEmail}}'
    password: wrong
auth:
  type: noauth
scripts:
- type: afterResponse
  code: pm.test("Статус 401", () => pm.response.to.have.status(401));
  language: text/javascript
order: 4000
