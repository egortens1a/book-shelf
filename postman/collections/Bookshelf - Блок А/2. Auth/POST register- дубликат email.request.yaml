$kind: http-request
name: 'POST register: дубликат email'
url: '{{baseUrl}}/register'
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "full_name": "Дубль",
      "email": "{{newEmail}}",
      "password": "{{newPassword}}"
    }
auth:
  type: noauth
scripts:
- type: afterResponse
  code: pm.test("Статус 409", () => pm.response.to.have.status(409));
  language: text/javascript
order: 2000
