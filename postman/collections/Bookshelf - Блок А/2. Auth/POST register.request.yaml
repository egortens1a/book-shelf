$kind: http-request
url: '{{baseUrl}}/register'
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "full_name": "Тест Читатель",
      "email": "x",
      "password": "{{newPassword}}"
    }
auth:
  type: noauth
scripts:
- type: beforeRequest
  code: |-
    pm.environment.set("newEmail", `reader_${Date.now()}@test.local`);
    pm.request.body.update(JSON.stringify({full_name:"Тест Читатель",email:pm.environment.get("newEmail"),password:pm.environment.get("newPassword")}));
  language: text/javascript
- type: afterResponse
  code: |-
    pm.test("Статус 201", () => pm.response.to.have.status(201));
    const j = pm.response.json();
    pm.environment.set("newReaderId", j.id);
  language: text/javascript
order: 1000
