$kind: http-request
name: 'GET me interests: библиотекарь'
url: '{{baseUrl}}/me/interests'
method: GET
auth:
  type: bearer
  credentials:
    token: '{{librarianToken}}'
scripts:
- type: afterResponse
  code: pm.test("Статус 403", () => pm.response.to.have.status(403));
  language: text/javascript
order: 5000
