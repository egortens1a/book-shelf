$kind: http-request
url: '{{baseUrl}}/me/recommendations'
method: GET
auth:
  type: bearer
  credentials:
    token: '{{readerToken}}'
scripts:
- type: afterResponse
  code: |-
    pm.test("Статус 200", () => pm.response.to.have.status(200));
    const j = pm.response.json();
    pm.test("Пустой список", () => pm.expect(j.items).to.eql([]));
  language: text/javascript
order: 8000
