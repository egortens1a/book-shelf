$kind: http-request
name: 'Подготовка: GET genres'
url: '{{baseUrl}}/genres'
method: GET
auth:
  type: bearer
  credentials:
    token: '{{readerToken}}'
scripts:
- type: afterResponse
  code: |-
    pm.test("Статус 200", () => pm.response.to.have.status(200));
    const j = pm.response.json();
    pm.environment.set("seedGenreId", j[0].id);
  language: text/javascript
order: 1000
