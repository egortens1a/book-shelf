$kind: http-request
name: 'GET admin users: читатель'
url: '{{baseUrl}}/admin/users'
method: GET
auth:
  type: bearer
  credentials:
    token: '{{readerToken}}'
scripts:
- type: afterResponse
  code: pm.test("Статус 403", () => pm.response.to.have.status(403));
  language: text/javascript
order: 2000
