$kind: http-request
url: '{{baseUrl}}/admin/users/{{newReaderId}}/block'
method: POST
auth:
  type: bearer
  credentials:
    token: '{{adminToken}}'
scripts:
- type: afterResponse
  code: |-
    pm.test("Статус 200", () => pm.response.to.have.status(200));
    const j = pm.response.json();
    pm.test("blocked", () => pm.expect(String(j.status).toLowerCase()).to.eql("blocked"));
  language: text/javascript
order: 5000
