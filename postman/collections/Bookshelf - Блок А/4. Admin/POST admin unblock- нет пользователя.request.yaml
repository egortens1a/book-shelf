$kind: http-request
name: 'POST admin unblock: нет пользователя'
url: '{{baseUrl}}/admin/users/999999999/unblock'
method: POST
auth:
  type: bearer
  credentials:
    token: '{{adminToken}}'
scripts:
- type: afterResponse
  code: pm.test("Статус 404", () => pm.response.to.have.status(404));
  language: text/javascript
order: 8000
