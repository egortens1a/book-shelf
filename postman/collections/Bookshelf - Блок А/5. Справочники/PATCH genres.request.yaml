$kind: http-request
url: '{{baseUrl}}/genres/{{genreId}}'
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "x"
    }
auth:
  type: bearer
  credentials:
    token: '{{adminToken}}'
scripts:
- type: beforeRequest
  code: pm.request.body.update(JSON.stringify({name:"Renamed genre "+Date.now()}));
  language: text/javascript
- type: afterResponse
  code: |-
    pm.test("Статус 200", () => pm.response.to.have.status(200));
    const j = pm.response.json();
    pm.test("Переименован", () => pm.expect(j.name.toLowerCase()).to.include("renamed"));
  language: text/javascript
order: 8000
