$kind: http-request
name: 'POST authors: читатель'
url: '{{baseUrl}}/authors'
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Хак"
    }
auth:
  type: bearer
  credentials:
    token: '{{readerToken}}'
scripts:
- type: afterResponse
  code: pm.test("Статус 403", () => pm.response.to.have.status(403));
  language: text/javascript
order: 13000
