$kind: http-request
url: '{{baseUrl}}/genres'
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "x"
    }
auth:
  type: bearer
  credentials:
    token: '{{adminToken}}'
scripts:
- type: beforeRequest
  code: pm.request.body.update(JSON.stringify({name:"Temp genre "+Date.now()}));
  language: text/javascript
- type: afterResponse
  code: |-
    pm.test("Статус 201", () => pm.response.to.have.status(201));
    const j = pm.response.json();
    pm.environment.set("genreId", j.id);
  language: text/javascript
order: 6000
