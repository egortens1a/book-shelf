$kind: http-request
name: 'GET librarian books: читатель'
url: '{{baseUrl}}/librarian/books'
method: GET
auth:
  type: bearer
  credentials:
    token: '{{readerToken}}'
scripts:
- type: afterResponse
  code: pm.test("Статус 403", () => pm.response.to.have.status(403));
  language: text/javascript
order: 8000
