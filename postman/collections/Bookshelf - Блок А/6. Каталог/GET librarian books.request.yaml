$kind: http-request
url: '{{baseUrl}}/librarian/books?title={{draftTitle}}'
method: GET
queryParams:
  title: '{{draftTitle}}'
auth:
  type: bearer
  credentials:
    token: '{{librarianToken}}'
scripts:
- type: afterResponse
  code: |-
    pm.test("Статус 200", () => pm.response.to.have.status(200));
    const j = pm.response.json();
    pm.test("Черновик виден библиотекарю", () => pm.expect(j.length).to.eql(1));
  language: text/javascript
order: 7000
