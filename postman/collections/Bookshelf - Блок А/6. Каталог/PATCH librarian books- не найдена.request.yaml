$kind: http-request
name: 'PATCH librarian books: не найдена'
url: '{{baseUrl}}/librarian/books/999999999'
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "X"
    }
auth:
  type: bearer
  credentials:
    token: '{{librarianToken}}'
scripts:
- type: afterResponse
  code: pm.test("Статус 404", () => pm.response.to.have.status(404));
  language: text/javascript
order: 12000
