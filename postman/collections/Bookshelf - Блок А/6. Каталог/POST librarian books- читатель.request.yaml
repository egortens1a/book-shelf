$kind: http-request
name: 'POST librarian books: читатель'
url: '{{baseUrl}}/librarian/books'
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "Хак"
    }
auth:
  type: bearer
  credentials:
    token: '{{readerToken}}'
scripts:
- type: afterResponse
  code: pm.test("Статус 403", () => pm.response.to.have.status(403));
  language: text/javascript
order: 6000
