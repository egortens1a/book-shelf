$kind: http-request
name: 'POST publish: без текста'
url: '{{baseUrl}}/librarian/books/{{bookId}}/publish'
method: POST
auth:
  type: bearer
  credentials:
    token: '{{librarianToken}}'
scripts:
- type: afterResponse
  code: pm.test("Статус 409", () => pm.response.to.have.status(409));
  language: text/javascript
order: 13000
