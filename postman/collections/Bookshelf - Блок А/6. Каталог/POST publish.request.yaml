$kind: http-request
url: '{{baseUrl}}/librarian/books/{{bookId}}/publish'
method: POST
auth:
  type: bearer
  credentials:
    token: '{{librarianToken}}'
scripts:
- type: afterResponse
  code: |-
    pm.test("Статус 200", () => pm.response.to.have.status(200));
    const j = pm.response.json();
    pm.test("published", () => pm.expect(String(j.status).toLowerCase()).to.eql("published"));
  language: text/javascript
order: 16000
