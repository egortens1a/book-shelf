$kind: http-request
name: 'PUT electronic: читатель'
url: '{{baseUrl}}/librarian/books/{{bookId}}/electronic'
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "access_type": "{{accessTypeFree}}",
      "text_content": "x"
    }
auth:
  type: bearer
  credentials:
    token: '{{readerToken}}'
scripts:
- type: afterResponse
  code: pm.test("Статус 403", () => pm.response.to.have.status(403));
  language: text/javascript
order: 15000
