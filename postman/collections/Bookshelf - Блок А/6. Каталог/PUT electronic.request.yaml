$kind: http-request
url: '{{baseUrl}}/librarian/books/{{bookId}}/electronic'
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "access_type": "{{accessTypeFree}}",
      "text_content": "Текст книги. "
    }
auth:
  type: bearer
  credentials:
    token: '{{librarianToken}}'
scripts:
- type: afterResponse
  code: pm.test("Статус 200", () => pm.response.to.have.status(200));
  language: text/javascript
order: 14000
