$kind: http-request
url: '{{baseUrl}}/books/{{ratedBookId}}/ratings'
method: GET
auth:
  type: bearer
  credentials:
    token: '{{readerToken}}'
scripts:
- type: afterResponse
  code: |-
    pm.test("Статус 200", () => pm.response.to.have.status(200));
    const j = pm.response.json();
    pm.test("Массив", () => pm.expect(j).to.be.an("array").that.is.not.empty);
  language: text/javascript
order: 3000
