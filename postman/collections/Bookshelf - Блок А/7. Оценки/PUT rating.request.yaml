$kind: http-request
url: '{{baseUrl}}/books/{{ratedBookId}}/rating'
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "score": 8,
      "comment": "Хорошо"
    }
auth:
  type: bearer
  credentials:
    token: '{{readerToken}}'
scripts:
- type: afterResponse
  code: |-
    pm.test("Статус 200", () => pm.response.to.have.status(200));
    const j = pm.response.json();
    pm.test("score=8", () => pm.expect(j.score).to.eql(8));
  language: text/javascript
order: 1000
