[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bookshelf"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "fastapi >= 0.144.0",
    "uvicorn >= 0.54.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic-settings>=2.0",
    "alembic>=1.13",
    "bcrypt>=4.0",
    "PyJWT>=2.15.1",
    "python-multipart>=0.0.32",
    "grpcio>=1.85.1,<2",
    "protobuf>=7.35.1,<8",
]

[project.optional-dependencies]
recommendations = [
    "fastembed>=0.9.0",
    "numpy>=1.26.0",
    "scipy>=1.11",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "jupyter>=1.0.0",
    "notebook>=7.0",
    "ipykernel>=6.29",
    "pandas>=3.0.6",
    "matplotlib>=3.11.2",
    "scikit-learn>=1.9.1",
    "fastembed>=0.9.0",
    "numpy>=1.26.0",
    "scipy>=1.11",
    "grpcio-tools==1.85.1",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["app*", "recsys*"]

[tool.setuptools.package-data]
"recsys.proto" = ["*.proto"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
pythonpath = ["src", "."]
testpaths = ["src/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
